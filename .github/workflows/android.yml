name: Lexa Social APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Expo & EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      # 💡 এখানে --auto-initialize যোগ করা হয়েছে, যা নিজে থেকে আইডি তৈরি করে বিল্ড স্টার্ট করবে
      - name: Build Android APK
        env:
          EAS_NO_VCS: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --auto-initialize
        
