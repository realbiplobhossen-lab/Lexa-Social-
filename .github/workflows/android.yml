name: Lexa Social APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 💡 এখানে --auto-initialize ফ্ল্যাগ ব্যবহার করা হয়েছে, যা এক্সপো সার্ভারকে বাধ্য করবে নিজে থেকে চাবি (Keystore) বানিয়ে নিতে
      - name: Trigger EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --auto-initialize
        
