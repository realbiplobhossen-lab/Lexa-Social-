name: Lexa Social APK Build

on:
  push:
    branches: [ "main" ] # আপনার ব্রাঞ্চের নাম অন্য কিছু হলে তা এখানে দিন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Expo & EAS CLI
        run: npm install -g expo-cli eas-cli

      # 💡 এখানে --legacy-peer-deps যোগ করা হয়েছে, যা ভার্সন এরর বাইপাস করবে
      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Login with Token
        run: eas login --token ${{ secrets.EXPO_TOKEN }}

      # এই কমান্ডটি এক্সপো ক্লাউড সার্ভারে অ্যান্ড্রয়েড APK বিল্ড শুরু করবে
      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
        
