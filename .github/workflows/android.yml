name: Lexa Social APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 🎯 ম্যাজিক স্টেপ: এটি গিটহাব থেকেই এক্সপো সার্ভারে আসল Keystore চাবি অটো-জেনারেট করে দেবে
      - name: Auto Generate Android Keystore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas credentials --platform android --profile preview --non-interactive

      # 🚀 চাবি তৈরি হয়ে যাওয়ার পর এখন এপিকে বিল্ড শুরু হবে
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
        
